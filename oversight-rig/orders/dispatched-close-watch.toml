[order]
description = "Mail the rig's project-lead (--notify) when a bead it dispatched closes."
# Rig-scoped (the default): each importing rig gets its own instance, run with $GC_RIG set, which
# mails <rig>/oversight-rig.project-lead, or $GC_OVERSIGHT_LEAD when the rig's lead is another agent
# ($GC_OVERSIGHT_LEAD_ALIASES: its other names). Child rigs the lead also dispatches into are added
# with GC_OVERSIGHT_CHILD_RIGS (comma-separated rig names). Fires on every bead.closed in the city; the
# script reads the last 10 minutes of closes and keeps only beads the lead created in the watched
# rigs, so overlapping instances never mail a lead about another lead's beads. The city-level
# instance has no rig and exits 0 without reading anything. Exits 2 (a failed run) when gc cannot
# be read or a mail fails. See "Dispatched-close watch" in the pack README.
trigger = "event"
on = "bead.closed"
exec = "python3 $GC_PACK_DIR/assets/scripts/dispatched-close-watch.py"
timeout = "2m"
